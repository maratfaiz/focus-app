name: Refocus
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Укажите ваш Team ID перед сборкой на устройстве
    DEVELOPMENT_TEAM: ""

targets:
  Refocus:
    type: application
    platform: iOS
    sources:
      - Refocus
      - Shared
    entitlements:
      path: Refocus/Refocus.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.refocus
        com.apple.developer.nfc.readersession.formats:
          - NDEF
    info:
      path: Refocus/Info.plist
      properties:
        CFBundleDisplayName: Refocus
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          Refocus использует ваше местоположение, чтобы автоматически включать
          и выключать блокировки в выбранных местах (дом, офис, библиотека).
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Доступ к геолокации в фоне нужен, чтобы правила по местоположению
          срабатывали, даже когда приложение закрыто.
        NFCReaderUsageDescription: >-
          NFC используется для снятия блокировки: приложите телефон к вашей
          зарегистрированной NFC-метке.
        UIBackgroundModes:
          - location
    dependencies:
      - target: RefocusMonitor
        embed: true
      - target: RefocusShieldConfiguration
        embed: true
      - target: RefocusShieldAction
        embed: true
      - target: RefocusReport
        embed: true

  RefocusMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Monitor
      - Shared
    entitlements:
      path: Extensions/Monitor/RefocusMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.refocus
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: RefocusMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).RefocusMonitorExtension

  RefocusShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldConfiguration
      - Shared
    entitlements:
      path: Extensions/ShieldConfiguration/RefocusShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.refocus
    info:
      path: Extensions/ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: RefocusShieldConfiguration
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  RefocusShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ShieldAction
      - Shared
    entitlements:
      path: Extensions/ShieldAction/RefocusShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.refocus
    info:
      path: Extensions/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: RefocusShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  RefocusReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Extensions/Report
      - Shared
    entitlements:
      path: Extensions/Report/RefocusReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.refocus
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: RefocusReport
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
